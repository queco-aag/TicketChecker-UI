version: '3.8'

services:
  ticketchecker-ui:
    build:
      context: .
      args:
        # Con nginx proxy, la URL es relativa (/api/v1 → nginx lo reenvía al backend).
        # Para sobreescribir: VITE_API_URL=http://miservidor:8090/api/v1 docker compose build
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
    container_name: ticketchecker-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - lottery-network

networks:
  lottery-network:
    name: lottery-network
    external: true   # La red debe existir; créala con: docker network create lottery-network
