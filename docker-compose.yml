version: '3.8'

services:
  ticketchecker-ui:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
    container_name: ticketchecker-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - ticketchecker-network

networks:
  ticketchecker-network:
    driver: bridge
