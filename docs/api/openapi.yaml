{"openapi":"3.0.1","info":{"title":"Lottery Ticket Checker API","description":"API para verificación y reclamación de premios de lotería.\n\nEsta API permite:\n- Verificar si un número de lotería tiene premio\n- Reclamar premios asociados a números ganadores\n- Gestionar la carga de premios mediante archivos CSV\n- Administrar el estado de premios (enviados, pendientes, reclamados)\n\n## Autenticación\n\nLa mayoría de endpoints requieren autenticación mediante JWT.\n\n**Pasos para autenticarse:**\n1. Crear primer admin: POST /api/auth/first-admin (solo primera vez)\n2. Iniciar sesión: POST /api/auth/login\n3. Copiar el token recibido\n4. Hacer clic en el botón \"Authorize\" arriba\n5. Pegar el token (sin \"Bearer\")\n\n","contact":{"name":"Lottery Service Support","email":"support@lottery.com"},"version":"1.0.0"},"servers":[{"url":"http://localhost:8080","description":"Servidor de desarrollo local"},{"url":"https://api.lottery.com","description":"Servidor de producción"}],"tags":[{"name":"Premios","description":"CRUD de premios y administración de estados"},{"name":"Autenticación","description":"Endpoints de registro, login y gestión de autenticación"},{"name":"Números","description":"Operaciones de verificación y reclamación de números premiados"},{"name":"Emparejamiento Números-Premios","description":"Asignación individual de números de sorteo a premios"},{"name":"Claves de Sorteo","description":"Gestión de claves anuales y validación de boletos por código HMAC"},{"name":"Usuarios","description":"Gestión administrativa de usuarios del sistema"}],"paths":{"/api/v1/usuarios/{id}":{"get":{"tags":["Usuarios"],"summary":"Obtener usuario por ID","operationId":"obtenerPorId","parameters":[{"name":"id","in":"path","description":"ID del usuario","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"responses":{"200":{"description":"Usuario encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"404":{"description":"Usuario no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"put":{"tags":["Usuarios"],"summary":"Actualizar datos de un usuario","description":"Permite cambiar el email y/o el nombre completo de un usuario. Sólo se actualizan los campos que se incluyan en el cuerpo.","operationId":"actualizar","parameters":[{"name":"id","in":"path","description":"ID del usuario","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActualizarUsuarioRequest"},"example":{"email":"nuevo@email.com","fullName":"Nuevo Nombre"}}},"required":true},"responses":{"400":{"description":"Email ya en uso","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"404":{"description":"Usuario no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Usuario actualizado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"delete":{"tags":["Usuarios"],"summary":"Eliminar un usuario","description":"Elimina permanentemente un usuario. No se puede eliminar al último administrador del sistema.","operationId":"eliminar","parameters":[{"name":"id","in":"path","description":"ID del usuario","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"responses":{"200":{"description":"Usuario eliminado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"409":{"description":"No se puede eliminar al único administrador","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"404":{"description":"Usuario no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/premios/{id}":{"get":{"tags":["Premios"],"summary":"Obtener premio por ID","operationId":"obtenerPorId_1","parameters":[{"name":"id","in":"path","description":"ID del premio","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"responses":{"404":{"description":"Premio no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Premio encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"put":{"tags":["Premios"],"summary":"Actualizar un premio existente","description":"Sólo se actualizan los campos informados (no nulos).","operationId":"actualizar_1","parameters":[{"name":"id","in":"path","description":"ID del premio","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CrearPremioRequest"}}},"required":true},"responses":{"404":{"description":"Premio no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Premio actualizado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"delete":{"tags":["Premios"],"summary":"Eliminar un premio","description":"Sólo se puede eliminar un premio que no tenga números asignados.","operationId":"eliminar_1","parameters":[{"name":"id","in":"path","description":"ID del premio","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"responses":{"404":{"description":"Premio no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"409":{"description":"Premio tiene números asignados","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Premio eliminado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/premios/{id}/marcar-enviado":{"put":{"tags":["Premios"],"summary":"Marcar un premio como enviado","description":"Actualiza el estado de un premio para marcarlo como enviado al ganador","operationId":"marcarEnviado","parameters":[{"name":"id","in":"path","description":"ID del premio","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"responses":{"200":{"description":"Premio marcado como enviado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"404":{"description":"Premio no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/premios":{"get":{"tags":["Premios"],"summary":"Listar todos los premios","description":"Devuelve el catálogo completo de premios registrados.","operationId":"listarTodos_1","responses":{"200":{"description":"Listado obtenido","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"post":{"tags":["Premios"],"summary":"Crear un nuevo premio","operationId":"crear","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CrearPremioRequest"}}},"required":true},"responses":{"201":{"description":"Premio creado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"400":{"description":"Datos inválidos","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/premios/cargar-csv":{"post":{"tags":["Premios"],"summary":"Cargar premios desde archivo CSV","description":"Formato: numero,nombrePremio,descripcionPremio,urlFotoPremio","operationId":"cargarCSV","requestBody":{"content":{"application/json":{"schema":{"required":["file"],"type":"object","properties":{"file":{"type":"string","description":"Archivo CSV","format":"binary"}}}}}},"responses":{"200":{"description":"Premios cargados","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"400":{"description":"CSV inválido","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/numeros/{numero}/reclamar":{"post":{"tags":["Números"],"summary":"Reclamar un premio","description":"Permite a un ganador reclamar su premio proporcionando sus datos personales, el código de validación impreso en el boleto (5 caracteres) y el año del sorteo. El sistema verifica la autenticidad del boleto mediante HMAC antes de registrar la reclamación.","operationId":"reclamarPremio","parameters":[{"name":"numero","in":"path","description":"Número de lotería premiado a reclamar","required":true,"schema":{"type":"string"},"example":12345},{"name":"nombre","in":"query","description":"Nombre completo del ganador","required":true,"schema":{"type":"string"},"example":"Juan Pérez"},{"name":"contacto","in":"query","description":"Información de contacto (teléfono o email)","required":true,"schema":{"type":"string"},"example":"+34 600 123 456"},{"name":"direccionEnvio","in":"query","description":"Dirección para el envío del premio","required":true,"schema":{"type":"string"},"example":"Calle Mayor 123, 28001 Madrid"},{"name":"codigoValidacion","in":"query","description":"Código de validación de 5 caracteres impreso en el boleto","required":true,"schema":{"type":"string"},"example":"A3K9Z"},{"name":"anio","in":"query","description":"Año del sorteo (para seleccionar la clave HMAC)","required":true,"schema":{"type":"integer","format":"int32"},"example":2026}],"requestBody":{"content":{"application/json":{"schema":{"type":"object","properties":{"comprobante":{"type":"string","description":"Archivo de comprobante (foto del ticket, DNI, etc.)","format":"binary"}}}}}},"responses":{"500":{"description":"Error interno del servidor","content":{"application/json":{}}},"200":{"description":"Premio reclamado exitosamente","content":{"application/json":{}}},"400":{"description":"Solicitud inválida (campos faltantes o premio ya reclamado)","content":{"application/json":{}}},"404":{"description":"Número no encontrado o no premiado","content":{"application/json":{}}}}}},"/api/v1/numeros-premiados":{"get":{"tags":["Emparejamiento Números-Premios"],"summary":"Listar todos los emparejamientos número-premio","description":"Devuelve todos los números de sorteo que tienen un premio asignado.","operationId":"listarTodos_2","responses":{"200":{"description":"Listado obtenido","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"post":{"tags":["Emparejamiento Números-Premios"],"summary":"Asignar un número de sorteo a un premio","description":"Crea el emparejamiento entre un número y un premio existente. El número no puede estar ya asignado.","operationId":"asignar","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AsignarNumeroRequest"},"example":{"numero":"12345","premioId":1}}},"required":true},"responses":{"400":{"description":"Número ya asignado o datos inválidos","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"404":{"description":"Premio no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"201":{"description":"Número asignado correctamente","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/claves":{"get":{"tags":["Claves de Sorteo"],"summary":"Listar claves registradas","description":"Devuelve los años con clave registrada. El secreto NO se expone. Requiere rol ADMIN.","operationId":"listarClaves","responses":{"200":{"description":"Listado obtenido","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"post":{"tags":["Claves de Sorteo"],"summary":"Crear o actualizar la clave secreta anual","description":"Almacena (o sobreescribe) la clave secreta de un año. Esta clave se usa en el algoritmo HMAC-SHA256 para calcular el código de validación impreso en cada boleto. **Atención:** actualizar la clave invalida todos los boletos impresos con la clave anterior. Requiere rol ADMIN.","operationId":"crearClave","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CrearClaveRequest"}}},"required":true},"responses":{"401":{"description":"No autenticado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"403":{"description":"Sin permisos de administrador","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"400":{"description":"Datos inválidos","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"201":{"description":"Clave creada correctamente","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Clave actualizada correctamente","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/claves/verificar-boleto":{"post":{"tags":["Claves de Sorteo"],"summary":"Verificar autenticidad de un boleto y si es premiado","description":"Recibe el número del boleto, el código de validación impreso y el año del sorteo. Primero valida que el código sea auténtico (calculando HMAC con la clave del año). Si el boleto es auténtico, comprueba si el número está premiado.","operationId":"verificarBoleto","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VerificarBoletoRequest"},"example":{"numero":157,"codigo":"A3K9Z","anio":2026}}},"required":true},"responses":{"200":{"description":"Verificación completada","content":{"application/json":{"examples":{"Boleto auténtico y premiado":{"description":"Boleto auténtico y premiado","value":{"numero":157,"anio":2026,"boletoAutentico":true,"success":true,"premiado":true,"reclamado":false,"premio":{"id":1,"nombre":"PlayStation 5","descripcion":"...","urlFoto":"..."},"mensaje":"¡Felicidades! El boleto es auténtico y está premiado"}},"Código incorrecto":{"description":"Código incorrecto","value":{"numero":157,"anio":2026,"boletoAutentico":false,"success":false,"mensaje":"El código de validación no corresponde a este número de boleto"}}}}}},"400":{"description":"Datos inválidos","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}}}},"/api/v1/auth/register":{"post":{"tags":["Autenticación"],"summary":"Registrar un nuevo usuario","description":"Registra un nuevo usuario en el sistema.\nEl usuario recibirá automáticamente el rol USER y un token JWT para autenticación.\n\n**Validaciones:**\n- El nombre de usuario debe ser único\n- El email debe ser único\n- La contraseña debe cumplir con los requisitos de seguridad\n","operationId":"register","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RegisterRequest"}}},"required":true},"responses":{"400":{"description":"Datos de registro inválidos","content":{"application/json":{}}},"500":{"description":"Error interno del servidor","content":{"application/json":{}}},"201":{"description":"Usuario registrado exitosamente","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AuthResponse"},"example":{"token":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...","type":"Bearer","username":"juanperez","email":"juan@example.com","fullName":"Juan Pérez García"}}}}}}},"/api/v1/auth/register-admin":{"post":{"tags":["Autenticación"],"summary":"Registrar nuevo administrador","description":"🔒 Requiere rol ADMIN - Crea un nuevo administrador\n\nPermite a un administrador existente crear nuevos administradores en el sistema.\n\n**Requiere autenticación:** Sí\n**Requiere rol:** ADMIN\n","operationId":"registerAdmin","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RegisterAdminRequest"}}},"required":true},"responses":{"500":{"description":"Error interno del servidor","content":{"application/json":{}}},"403":{"description":"Acceso denegado - requiere rol ADMIN","content":{"application/json":{}}},"400":{"description":"Datos inválidos","content":{"application/json":{}}},"201":{"description":"Administrador registrado exitosamente","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AuthResponse"}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/auth/login":{"post":{"tags":["Autenticación"],"summary":"Iniciar sesión","description":"Autentica un usuario existente y devuelve un token JWT.\n\nEl token debe incluirse en las peticiones subsiguientes usando el header:\n`Authorization: Bearer {token}`\n","operationId":"login","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LoginRequest"}}},"required":true},"responses":{"500":{"description":"Error interno del servidor","content":{"application/json":{}}},"401":{"description":"Credenciales inválidas","content":{"application/json":{}}},"200":{"description":"Autenticación exitosa","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AuthResponse"}}}}}}},"/api/v1/auth/first-admin":{"post":{"tags":["Autenticación"],"summary":"Crear primer administrador","description":"⚠️ SOLO FUNCIONA SI NO EXISTE NINGÚN ADMIN - Inicialización del sistema\n\nCrea el primer administrador del sistema. Este endpoint solo puede ser usado\ncuando no existe ningún administrador en la base de datos. Es útil para la\ninicialización del sistema.\n\n**Requiere autenticación:** No\n","operationId":"createFirstAdmin","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RegisterAdminRequest"}}},"required":true},"responses":{"403":{"description":"Ya existe al menos un administrador","content":{"application/json":{}}},"500":{"description":"Error interno del servidor","content":{"application/json":{}}},"201":{"description":"Primer administrador creado exitosamente","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AuthResponse"}}}},"400":{"description":"Datos inválidos","content":{"application/json":{}}}}}},"/api/v1/usuarios/{id}/toggle-habilitado":{"patch":{"tags":["Usuarios"],"summary":"Activar o desactivar una cuenta de usuario","description":"Alterna el estado de habilitación de la cuenta. Un usuario deshabilitado no puede iniciar sesión.","operationId":"toggleHabilitado","parameters":[{"name":"id","in":"path","description":"ID del usuario","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"responses":{"200":{"description":"Estado cambiado","content":{"*/*":{"example":{"success":true,"habilitado":false,"mensaje":"Cuenta deshabilitada correctamente"}}}},"404":{"description":"Usuario no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/usuarios":{"get":{"tags":["Usuarios"],"summary":"Listar todos los usuarios","description":"Devuelve todos los usuarios registrados en el sistema. Las contraseñas nunca se exponen.","operationId":"listarTodos","responses":{"200":{"description":"Listado obtenido","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/premios/reclamados":{"get":{"tags":["Premios"],"summary":"Listar premios reclamados","operationId":"obtenerReclamados","responses":{"200":{"description":"OK","content":{"*/*":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/NumeroPremiado"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/premios/pendientes":{"get":{"tags":["Premios"],"summary":"Listar premios pendientes de envío","description":"Premios reclamados pero aún no enviados","operationId":"obtenerPendientes","responses":{"200":{"description":"OK","content":{"*/*":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/NumeroPremiado"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/premios/enviados":{"get":{"tags":["Premios"],"summary":"Listar premios enviados","operationId":"obtenerEnviados","responses":{"200":{"description":"OK","content":{"*/*":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/Premio"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/numeros/{numero}/verificar":{"get":{"tags":["Números"],"summary":"Verificar si un número tiene premio","description":"Verifica si un número específico está premiado y devuelve la información del premio asociado","operationId":"verificarNumero","parameters":[{"name":"numero","in":"path","description":"Número de lotería a verificar","required":true,"schema":{"type":"string"},"example":12345}],"responses":{"500":{"description":"Error interno del servidor","content":{"application/json":{}}},"200":{"description":"Verificación exitosa","content":{"application/json":{"schema":{"type":"string"},"examples":{"Número premiado":{"description":"Número premiado","value":{"success":true,"premiado":true,"mensaje":"¡Felicidades! Este número está premiado","premio":{"id":1,"nombre":"PlayStation 5","descripcion":"Consola de videojuegos de última generación","urlFoto":"https://example.com/ps5.jpg","enviado":false},"reclamado":false}},"Número no premiado":{"description":"Número no premiado","value":{"success":true,"premiado":false,"mensaje":"Este número no está premiado","reclamado":false}}}}}}}}},"/api/v1/numeros-premiados/{numero}":{"get":{"tags":["Emparejamiento Números-Premios"],"summary":"Obtener emparejamiento por número de sorteo","operationId":"obtenerPorNumero","parameters":[{"name":"numero","in":"path","description":"Número de sorteo","required":true,"schema":{"type":"string"},"example":12345}],"responses":{"404":{"description":"Número no asignado a ningún premio","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Emparejamiento encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]},"delete":{"tags":["Emparejamiento Números-Premios"],"summary":"Eliminar la asignación de un número","description":"Elimina el emparejamiento número-premio. No es posible eliminar si el premio ya fue reclamado por su portador.","operationId":"eliminarAsignacion","parameters":[{"name":"numero","in":"path","description":"Número de sorteo","required":true,"schema":{"type":"string"},"example":12345}],"responses":{"409":{"description":"Premio ya reclamado, no se puede eliminar","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"404":{"description":"Número no asignado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Asignación eliminada","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/numeros-premiados/premio/{premioId}":{"get":{"tags":["Emparejamiento Números-Premios"],"summary":"Listar números asignados a un premio concreto","operationId":"listarPorPremio","parameters":[{"name":"premioId","in":"path","description":"ID del premio","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"responses":{"404":{"description":"Premio no encontrado","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}},"200":{"description":"Listado obtenido","content":{"*/*":{"schema":{"type":"object","additionalProperties":{"type":"object"}}}}}},"security":[{"bearerAuth":[]}]}},"/api/v1/claves/{anio}":{"get":{"tags":["Claves de Sorteo"],"summary":"Obtener información de la clave de un año","description":"Devuelve los metadatos de la clave del año indicado (sin revelar el secreto). Requiere rol ADMIN.","operationId":"obtenerClave","parameters":[{"name":"anio","in":"path","description":"Año del sorteo","required":true,"schema":{"t