openapi: 3.0.3
info:
  title: Lottery Ticket Checker API
  description: |
    API para verificación y reclamación de premios de lotería.
    
    Esta API permite:
    - Verificar si un número de lotería tiene premio
    - Reclamar premios asociados a números ganadores
    - Gestionar la carga de premios mediante archivos CSV
    - Administrar el estado de premios (enviados, pendientes, reclamados)

  version: 1.0.0
  contact:
    name: Lottery Service Support
    email: support@lottery.com

servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo local - API v1
  - url: https://api.lottery.com/v1
    description: Servidor de producción - API v1

tags:
  - name: Autenticación
    description: Endpoints de registro, login y gestión de autenticación
  - name: Números
    description: Operaciones de verificación y reclamación de números premiados
  - name: Premios
    description: Gestión de premios y administración

paths:
  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar un nuevo usuario
      description: |
        Registra un nuevo usuario en el sistema. 
        El usuario recibirá automáticamente el rol USER y un token JWT para autenticación.
        
        **Validaciones:**
        - El nombre de usuario debe ser único
        - El email debe ser único
        - La contraseña debe cumplir con los requisitos de seguridad
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: "juanperez"
              password: "SecurePass123!"
              email: "juan@example.com"
              fullName: "Juan Pérez García"
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                type: "Bearer"
                username: "juanperez"
                email: "juan@example.com"
                fullName: "Juan Pérez García"
        '400':
          description: Datos de registro inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                username_duplicado:
                  summary: Nombre de usuario ya existe
                  value:
                    success: false
                    mensaje: "El nombre de usuario ya está en uso"
                email_duplicado:
                  summary: Email ya existe
                  value:
                    success: false
                    mensaje: "El email ya está en uso"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: |
        Autentica un usuario existente y devuelve un token JWT.
        
        El token debe incluirse en las peticiones subsiguientes usando el header:
        `Authorization: Bearer {token}`
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "juanperez"
              password: "SecurePass123!"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                type: "Bearer"
                username: "juanperez"
                email: "juan@example.com"
                fullName: "Juan Pérez García"
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                mensaje: "Credenciales inválidas"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Autenticación
      summary: Obtener información del usuario actual
      description: |
        Devuelve la información del usuario actualmente autenticado.
        
        **Requiere autenticación:** Sí
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Información del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Usuario autenticado"
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                mensaje: "No autenticado"

  /auth/first-admin:
    post:
      tags:
        - Autenticación
      summary: Crear primer administrador
      description: |
        ⚠️ SOLO FUNCIONA SI NO EXISTE NINGÚN ADMIN - Inicialización del sistema
        
        Crea el primer administrador del sistema. Este endpoint solo puede ser usado
        cuando no existe ningún administrador en la base de datos. Es útil para la
        inicialización del sistema.
        
        **Requiere autenticación:** No
      operationId: createFirstAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: "admin"
              password: "Admin123!"
              email: "admin@example.com"
              fullName: "Administrador Principal"
      responses:
        '201':
          description: Primer administrador creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                type: "Bearer"
                username: "admin"
                email: "admin@example.com"
                fullName: "Administrador Principal"
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Ya existe al menos un administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                mensaje: "Ya existe al menos un administrador en el sistema"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register-admin:
    post:
      tags:
        - Autenticación
      summary: Registrar nuevo administrador
      description: |
        🔒 Requiere rol ADMIN - Crea un nuevo administrador
        
        Permite a un administrador existente crear nuevos administradores en el sistema.
        
        **Requiere autenticación:** Sí
        **Requiere rol:** ADMIN
      operationId: registerAdmin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: "admin2"
              password: "Admin456!"
              email: "admin2@example.com"
              fullName: "Segundo Administrador"
      responses:
        '201':
          description: Administrador registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                type: "Bearer"
                username: "admin2"
                email: "admin2@example.com"
                fullName: "Segundo Administrador"
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado - requiere rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Acceso denegado - requiere rol ADMIN"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /numeros/{numero}/verificar:
    get:
      tags:
        - Números
      summary: Verificar si un número tiene premio
      description: Verifica si un número específico está premiado y devuelve la información del premio asociado
      operationId: verificarNumero
      parameters:
        - name: numero
          in: path
          description: Número de lotería a verificar
          required: true
          schema:
            type: string
          example: "12345"
      responses:
        '200':
          description: Verificación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificarNumeroResponse'
              examples:
                premiado:
                  summary: Número premiado
                  value:
                    success: true
                    premiado: true
                    mensaje: "¡Felicidades! Este número está premiado"
                    premio:
                      id: 1
                      nombre: "PlayStation 5"
                      descripcion: "Consola de videojuegos de última generación"
                      urlFoto: "https://example.com/ps5.jpg"
                      enviado: false
                    reclamado: false
                no_premiado:
                  summary: Número no premiado
                  value:
                    success: true
                    premiado: false
                    mensaje: "Este número no está premiado"
                    reclamado: false
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /numeros/{numero}/reclamar:
    post:
      tags:
        - Números
      summary: Reclamar un premio
      description: |
        Permite a un ganador reclamar su premio proporcionando sus datos personales y opcionalmente un comprobante
        
        ⚠️ Endpoint sensible - Usa HTTPS en producción
      operationId: reclamarPremio
      parameters:
        - name: numero
          in: path
          description: Número de lotería premiado a reclamar
          required: true
          schema:
            type: string
          example: "12345"
        - name: X-CSRF-TOKEN
          in: header
          description: Token CSRF para protección
          required: false
          schema:
            type: string
          example: "csrf-token-here"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - nombre
                - contacto
              properties:
                nombre:
                  type: string
                  description: Nombre completo del ganador
                  example: "Juan Pérez"
                contacto:
                  type: string
                  description: Información de contacto (teléfono o email)
                  example: "+34 600 123 456"
                direccionEnvio:
                  type: string
                  description: Dirección para el envío del premio
                  example: "Calle Mayor 123, 28001 Madrid"
                comprobante:
                  type: string
                  format: binary
                  description: Archivo de comprobante (foto del ticket, DNI, etc.)
      responses:
        '200':
          description: Premio reclamado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamarPremioResponse'
              example:
                success: true
                mensaje: "Premio reclamado exitosamente"
                numeroPremiado:
                  id: 1
                  numero: "12345"
                  reclamado: true
                  premio:
                    id: 1
                    nombre: "PlayStation 5"
                    descripcion: "Consola de videojuegos de última generación"
                    urlFoto: "https://example.com/ps5.jpg"
                    enviado: false
                  premiado:
                    id: 1
                    nombre: "Juan Pérez"
                    contacto: "+34 600 123 456"
                    direccionEnvio: "Calle Mayor 123, 28001 Madrid"
                    comprobanteUrl: "/uploads/comprobante_12345.jpg"
                    fechaReclamacion: "2025-12-23T10:30:00"
        '400':
          description: Solicitud inválida (campos faltantes o premio ya reclamado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ya_reclamado:
                  summary: Premio ya reclamado
                  value:
                    success: false
                    mensaje: "Este premio ya ha sido reclamado"
                campo_faltante:
                  summary: Campo obligatorio faltante
                  value:
                    success: false
                    mensaje: "El nombre es obligatorio"
        '404':
          description: Número no encontrado o no premiado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                mensaje: "Número no encontrado o no está premiado"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /premios/cargar-csv:
    post:
      tags:
        - Premios
      summary: Cargar premios desde archivo CSV
      description: |
        🔒 Requiere rol ADMIN - Carga masiva de premios
        
        Carga un lote de premios desde un archivo CSV.
        
        El formato del CSV debe ser:
        ```
        numero,nombrePremio,descripcionPremio,urlFotoPremio
        12345,PlayStation 5,Consola de videojuegos,https://example.com/ps5.jpg
        67890,Xbox Series X,Consola de última generación,https://example.com/xbox.jpg
        ```
      operationId: cargarCSV
      security:
        - bearerAuth: []
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          description: Token CSRF para protección
          required: false
          schema:
            type: string
          example: "csrf-token-here"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo CSV con los premios a cargar
      responses:
        '200':
          description: Premios cargados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Premios cargados exitosamente"
                  cantidadCargada:
                    type: integer
                    description: Número de premios cargados
                    example: 150
        '400':
          description: Error de validación en el archivo CSV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /premios:
    get:
      tags:
        - Premios
      summary: Listar todos los premios
      description: |
        🔒 Requiere rol ADMIN - Obtiene el catálogo completo de premios
        
        Devuelve la lista de todos los premios registrados en el sistema.
      operationId: listarPremios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de premios obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  premios:
                    type: array
                    items:
                      $ref: '#/components/schemas/PremioDetallado'
              examples:
                lista_premios:
                  summary: Lista de premios
                  value:
                    success: true
                    premios:
                      - id: 1
                        nombre: "PlayStation 5"
                        descripcion: "Consola de videojuegos de última generación"
                        urlFoto: "https://example.com/ps5.jpg"
                        anio: 2026
                        enviado: false
                      - id: 2
                        nombre: "Xbox Series X"
                        descripcion: "Consola de Microsoft"
                        urlFoto: "https://example.com/xbox.jpg"
                        anio: 2026
                        enviado: false
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado - requiere rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Premios
      summary: Crear un nuevo premio
      description: |
        🔒 Requiere rol ADMIN - Crea un premio individual
        
        Crea un nuevo premio en el sistema proporcionando los detalles del mismo.
        
        **Nota:** Para carga masiva de premios, usar `/premios/cargar-csv`
      operationId: crearPremio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPremioRequest'
            example:
              nombre: "PlayStation 5"
              descripcion: "Consola de videojuegos de última generación"
              urlFoto: "https://example.com/ps5.jpg"
              anio: 2026
      responses:
        '201':
          description: Premio creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Premio creado exitosamente"
                  premio:
                    $ref: '#/components/schemas/PremioDetallado'
              example:
                success: true
                mensaje: "Premio creado exitosamente"
                premio:
                  id: 1
                  nombre: "PlayStation 5"
                  descripcion: "Consola de videojuegos de última generación"
                  urlFoto: "https://example.com/ps5.jpg"
                  anio: 2026
                  enviado: false
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nombre_requerido:
                  summary: Nombre es obligatorio
                  value:
                    success: false
                    mensaje: "El nombre del premio es obligatorio"
                anio_invalido:
                  summary: Año inválido
                  value:
                    success: false
                    mensaje: "El año debe ser un valor válido"
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado - requiere rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /premios/{id}:
    get:
      tags:
        - Premios
      summary: Obtener un premio por ID
      description: |
        🔒 Requiere rol ADMIN - Obtiene los detalles de un premio específico
      operationId: obtenerPremio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID del premio a obtener
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Premio encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  premio:
                    $ref: '#/components/schemas/PremioDetallado'
              example:
                success: true
                premio:
                  id: 1
                  nombre: "PlayStation 5"
                  descripcion: "Consola de videojuegos de última generación"
                  urlFoto: "https://example.com/ps5.jpg"
                  anio: 2026
                  enviado: false
        '404':
          description: Premio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                mensaje: "Premio no encontrado"
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado - requiere rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Premios
      summary: Actualizar un premio existente
      description: |
        🔒 Requiere rol ADMIN - Actualiza los datos de un premio
        
        Solo se actualizan los campos que se incluyan en el cuerpo de la petición.
      operationId: actualizarPremio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID del premio a actualizar
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPremioRequest'
            example:
              nombre: "PlayStation 5 Pro"
              descripcion: "Versión mejorada de la consola"
              urlFoto: "https://example.com/ps5-pro.jpg"
      responses:
        '200':
          description: Premio actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Premio actualizado exitosamente"
                  premio:
                    $ref: '#/components/schemas/PremioDetallado'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Premio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado - requiere rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Premios
      summary: Eliminar un premio
      description: |
        🔒 Requiere rol ADMIN - Elimina un premio del sistema
        
        ⚠️ **ATENCIÓN:** No se puede eliminar un premio que tenga números asignados.
        Primero debes eliminar todos los emparejamientos de números con este premio.
      operationId: eliminarPremio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID del premio a eliminar
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Premio eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Premio eliminado exitosamente"
        '404':
          description: Premio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                mensaje: "Premio no encontrado"
        '409':
          description: Conflicto - El premio tiene números asignados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                mensaje: "No se puede eliminar el premio porque tiene números asignados"
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado - requiere rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /premios/{id}/marcar-enviado:
    put:
      tags:
        - Premios
      summary: Marcar un premio como enviado
      description: Actualiza el estado de un premio para marcarlo como enviado al ganador
      operationId: marcarEnviado
      parameters:
        - name: id
          in: path
          description: ID del premio a marcar como enviado
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Premio marcado como enviado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: "Premio marcado como enviado"
        '404':
          description: Premio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /premios/enviados:
    get:
      tags:
        - Premios
      summary: Listar premios enviados
      description: Obtiene la lista de todos los premios que han sido marcados como enviados
      operationId: obtenerEnviados
      responses:
        '200':
          description: Lista de premios enviados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Premio'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /premios/pendientes:
    get:
      tags:
        - Premios
      summary: Listar premios pendientes de envío
      description: Obtiene la lista de premios que han sido reclamados pero aún no han sido enviados
      operationId: obtenerPendientes
      responses:
        '200':
          description: Lista de premios pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NumeroPremiado'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /premios/reclamados:
    get:
      tags:
        - Premios
      summary: Listar todos los premios reclamados
      description: Obtiene la lista completa de premios que han sido reclamados, independientemente de su estado de envío
      operationId: obtenerReclamados
      responses:
        '200':
          description: Lista de premios reclamados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NumeroPremiado'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtenido mediante login o registro.
        
        Incluir en el header: `Authorization: Bearer {token}`

  schemas:
    RegisterRequest:
      type: object
      description: Datos necesarios para registrar un nuevo usuario
      required:
        - username
        - password
        - email
        - fullName
      properties:
        username:
          type: string
          description: Nombre de usuario único
          minLength: 3
          maxLength: 50
          example: "juanperez"
        password:
          type: string
          description: Contraseña del usuario
          format: password
          minLength: 8
          example: "SecurePass123!"
        email:
          type: string
          description: Email del usuario
          format: email
          example: "juan@example.com"
        fullName:
          type: string
          description: Nombre completo del usuario
          example: "Juan Pérez García"

    LoginRequest:
      type: object
      description: Credenciales para iniciar sesión
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Nombre de usuario
          example: "juanperez"
        password:
          type: string
          description: Contraseña del usuario
          format: password
          example: "SecurePass123!"

    AuthResponse:
      type: object
      description: Respuesta de autenticación exitosa
      properties:
        token:
          type: string
          description: Token JWT para autenticación
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJqdWFucGVyZXoiLCJpYXQiOjE3MDM0MzYwMDB9.abc123"
        type:
          type: string
          description: Tipo de token
          example: "Bearer"
          default: "Bearer"
        username:
          type: string
          description: Nombre de usuario
          example: "juanperez"
        email:
          type: string
          description: Email del usuario
          example: "juan@example.com"
        fullName:
          type: string
          description: Nombre completo del usuario
          example: "Juan Pérez García"

    Premio:
      type: object
      description: Representa un premio en el sistema
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del premio
          example: 1
        nombre:
          type: string
          description: Nombre del premio
          example: "PlayStation 5"
        descripcion:
          type: string
          description: Descripción detallada del premio
          example: "Consola de videojuegos de última generación"
          maxLength: 1000
        urlFoto:
          type: string
          description: URL de la imagen del premio
          example: "https://example.com/ps5.jpg"
        enviado:
          type: boolean
          description: Indica si el premio ha sido enviado
          default: false
          example: false

    Premiado:
      type: object
      description: Representa a una persona que ha reclamado un premio
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del premiado
          example: 1
        nombre:
          type: string
          description: Nombre completo del ganador
          example: "Juan Pérez"
        contacto:
          type: string
          description: Información de contacto (teléfono o email)
          example: "+34 600 123 456"
        direccionEnvio:
          type: string
          description: Dirección de envío del premio
          example: "Calle Mayor 123, 28001 Madrid"
          maxLength: 500
        comprobanteUrl:
          type: string
          description: URL del archivo de comprobante subido
          example: "/uploads/comprobante_12345.jpg"
        fechaReclamacion:
          type: string
          format: date-time
          description: Fecha y hora en que se reclamó el premio
          example: "2025-12-23T10:30:00"

    NumeroPremiado:
      type: object
      description: Representa un número de lotería que tiene premio asignado
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del número premiado
          example: 1
        numero:
          type: string
          description: Número de lotería
          example: "12345"
        premio:
          $ref: '#/components/schemas/Premio'
        premiado:
          $ref: '#/components/schemas/Premiado'
        reclamado:
          type: boolean
          description: Indica si el premio ha sido reclamado
          default: false
          example: false

    VerificarNumeroResponse:
      type: object
      description: Respuesta de la verificación de un número
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
          example: true
        premiado:
          type: boolean
          description: Indica si el número está premiado
          example: true
        mensaje:
          type: string
          description: Mensaje descriptivo del resultado
          example: "¡Felicidades! Este número está premiado"
        premio:
          $ref: '#/components/schemas/Premio'
        reclamado:
          type: boolean
          description: Indica si el premio ya ha sido reclamado
          example: false

    ReclamarPremioResponse:
      type: object
      description: Respuesta de la reclamación de un premio
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
          example: true
        mensaje:
          type: string
          description: Mensaje descriptivo del resultado
          example: "Premio reclamado exitosamente"
        numeroPremiado:
          $ref: '#/components/schemas/NumeroPremiado'

    ErrorResponse:
      type: object
      description: Respuesta de error estándar
      properties:
        success:
          type: boolean
          description: Siempre false en caso de error
          example: false
        mensaje:
          type: string
          description: Descripción del error
          example: "Error al procesar la solicitud"

    CrearPremioRequest:
      type: object
      description: Datos necesarios para crear un nuevo premio
      required:
        - nombre
        - descripcion
        - anio
      properties:
        nombre:
          type: string
          description: Nombre del premio
          minLength: 1
          maxLength: 200
          example: "PlayStation 5"
        descripcion:
          type: string
          description: Descripción detallada del premio
          minLength: 1
          maxLength: 1000
          example: "Consola de videojuegos de última generación"
        urlFoto:
          type: string
          description: URL de la imagen del premio
          format: uri
          example: "https://example.com/ps5.jpg"
        anio:
          type: integer
          description: Año del sorteo al que pertenece el premio
          minimum: 2000
          maximum: 2100
          example: 2026

    ActualizarPremioRequest:
      type: object
      description: Datos para actualizar un premio existente (todos los campos son opcionales)
      properties:
        nombre:
          type: string
          description: Nuevo nombre del premio
          minLength: 1
          maxLength: 200
          example: "PlayStation 5 Pro"
        descripcion:
          type: string
          description: Nueva descripción del premio
          minLength: 1
          maxLength: 1000
          example: "Versión mejorada de la consola"
        urlFoto:
          type: string
          description: Nueva URL de la imagen del premio
          format: uri
          example: "https://example.com/ps5-pro.jpg"
        anio:
          type: integer
          description: Año del sorteo
          minimum: 2000
          maximum: 2100
          example: 2026

    PremioDetallado:
      type: object
      description: Representa un premio con todos sus detalles
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del premio
          example: 1
        nombre:
          type: string
          description: Nombre del premio
          example: "PlayStation 5"
        descripcion:
          type: string
          description: Descripción detallada del premio
          example: "Consola de videojuegos de última generación"
          maxLength: 1000
        urlFoto:
          type: string
          description: URL de la imagen del premio
          example: "https://example.com/ps5.jpg"
        anio:
          type: integer
          description: Año del sorteo al que pertenece el premio
          example: 2026
        enviado:
          type: boolean
          description: Indica si el premio ha sido enviado
          default: false
          example: false

